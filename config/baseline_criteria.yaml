# 45 项第一批 · VL 基线评测判据（试点 4 组）
#
# 说明
# - check_items.yaml 里 sub_items 只有 name，没有可判的视觉判据；基线必须给判据，
#   否则模型只能凭文件名猜。本文件为评测专用，按 sub_code 索引。
# - 每条含三段：判据（什么算有）、边界（什么不算）、观察条件（能不能判）。
# - 判据只描述「看得见的视觉证据」，不引用现场台账，不放答案特征。
# - 待专家确认后，正式判据应合并回 config/check_items.yaml 的 criteria 字段。

version: '2026-11-08.baseline.1'

sub_items:
  '6.11':
    name: 法兰螺栓或螺母松动、缺失或腐蚀生锈
    criteria: >-
      法兰周向应有均布的螺栓/螺母。出现下列任一即判定存在缺陷：
      (a) 法兰孔空置，螺栓或螺母缺失；
      (b) 螺母退出，螺母与垫圈之间出现可见间隙，或螺栓明显歪斜、未与法兰面垂直；
      (c) 螺栓、螺母或垫圈表面有红褐色锈蚀、起皮、腐蚀产物。
    boundary: >-
      不算缺陷：整片法兰被保温层或防护罩遮住，看不见螺栓；只拍到管道管体、画面内没有法兰；
      表面仅有油漆色差、灰尘、水渍而无锈蚀特征；远距离导致螺栓小于可辨识尺寸。
    observation: 需要法兰正对或侧向近景，能分辨单颗螺栓轮廓与螺母端面。

  '6.13':
    name: 长度过短导致丝扣外露不足2-3扣
    criteria: >-
      螺栓拧紧后，螺母外侧露出的螺纹牙数不足 2 扣（含完全平齐、完全不出扣）。
      判定依据是「螺母端面之外可见的螺纹圈数」，不是螺栓总长度。
    boundary: >-
      不算缺陷：外露 3 扣及以上属正常；螺纹被厚漆、锈层或胶泥完全覆盖导致数不清圈数；
      使用双螺母、加长螺母或沉头螺栓等结构导致端面无外露，但紧固正常。
    observation: 必须近景且对焦清晰，单扣螺纹可分辨；整图缩放后看不清即视为不可判定。

  '6.9':
    name: 法兰密封面有介质混痕迹（结霜、结垢、腐蚀斑）
    criteria: >-
      两法兰接缝处或法兰外缘存在介质泄漏/渗出留下的痕迹，表现为：
      (a) 白色或淡黄色结晶、结霜、结垢；
      (b) 湿痕、流挂痕、油污渗出；
      (c) 接缝处局部腐蚀斑、锈迹冲刷痕。
      判定位置必须在法兰接缝或紧邻接缝的外缘，而不是管道任意位置。
    boundary: >-
      不算缺陷：管道本体锈蚀但法兰接缝干净；法兰表面油漆脱落、机械划痕；
      背景地面或邻近设备的污渍；正常的水珠/雨痕且无结晶或流挂方向。
    observation: 需要看清两片法兰的贴合缝；缝被包覆或画幅截断时不可判定。

  '11.1':
    name: 防爆分区内使用电气设备设施铭牌上无防爆EX标识，非防爆
    criteria: >-
      电气设备（接线盒、配电箱、照明灯、仪表）铭牌上无 "Ex" 防爆标志。
      判定需要看清铭牌内容：有 Ex 字样及防爆型式代号即为合规。
    boundary: >-
      不算缺陷：铭牌被油污、漆层遮挡导致完全读不到；画面里没有铭牌或铭牌不在可视面；
      铭牌可见且有 Ex 标识但模糊，属正常。铭牌不可读时不可判定，不得据此判为无标识。
    observation: 需要铭牌正对镜头且可读到字符，本质是 OCR 级任务。

  '11.3':
    name: 防爆电气设备或带EX标识的防爆接线盒外壳开裂、螺栓缺失、螺栓松动
    criteria: >-
      防爆接线盒/设备外壳出现：壳体裂纹或破洞；盖板固定螺栓缺失；盖板与壳体之间出现
      可见缝隙（未压紧）、螺栓未拧到位。
    boundary: >-
      不算缺陷：正常工艺分模线、铸造纹理被误认为裂纹；外壳油漆裂纹但基体完好；
      盖板缝隙属于设计上的防水槽；螺栓被密封胶覆盖看不见。
    observation: 需要近景，能看清盖板四角与周向螺栓。

  '11.4':
    name: 空闲的电缆进线口没有使用防爆格兰头且无封堵
    criteria: >-
      接线盒/设备上预留但未使用的电缆进线口，敞口裸露，既无防爆格兰头也无堵头/胶泥封堵。
    boundary: >-
      不算缺陷：进线口已装格兰头但未接电缆（有格兰头即合规）；进线口有金属堵头；
      进线口被胶泥封堵；画面中进线口朝内不可见。
    observation: 需要看清进线口端面，判断是否有格兰头或封堵件。

  '11.6':
    name: 电缆进出口未使用防爆格兰头且未使用防爆胶泥封堵
    criteria: >-
      已接入电缆的进出口，电缆与孔之间无防爆格兰头压紧，且孔内无防爆胶泥封堵，
      电缆处于直接穿孔状态（可见明显空隙）。
    boundary: >-
      不算缺陷：有格兰头并已压紧；孔内可见胶泥填充；电缆穿孔但间隙被密封件填充；
      穿线管接头属合规连接。
    observation: 需要看清电缆进入孔位的连接件形态。

  '11.7':
    name: 防爆格兰头脱落或未拧紧
    criteria: >-
      格兰头本体脱落、与设备脱开，或压紧螺母未拧到位（可见螺纹外露、密封圈未压紧、
      格兰头与壳体间有明显缝隙）。
    boundary: >-
      不算缺陷：格兰头已拧紧但有少量螺纹外露属正常；格兰头表面锈蚀但紧固到位；
      看不清螺纹或密封圈状态时不可判定。
    observation: 需要近景，能看清格兰头与壳体的贴合面。

  '11.8':
    name: 防爆照明灯防爆结构及保护罩有缝隙
    criteria: >-
      防爆灯具的透明罩与灯体之间、或防爆结构接合面存在可见缝隙、密封圈外露/缺失、
      卡扣未扣合。
    boundary: >-
      不算缺陷：设计上预留的排水缝；灯具正常分型面；罩体有污渍但不影响贴合；
      逆光导致轮廓看不清时不可判定。
    observation: 需要看清灯具接合面轮廓。

merged:
  'CI-11':
    name: 防爆电气设备（合并判据）
    criteria: >-
      画面中的防爆电气设备（防爆接线盒、配电箱、照明灯、仪表、格兰头）是否存在下列任一缺陷：
      (1) 铭牌无 Ex 防爆标识；
      (2) 空闲电缆进线口无防爆格兰头且无封堵；
      (3) 外壳开裂、盖板螺栓缺失或松动；
      (4) 电缆进出口无格兰头且无胶泥封堵；
      (5) 格兰头脱落或未拧紧；
      (6) 防爆灯具保护罩有缝隙。
    boundary: >-
      不算缺陷：设备完好、各连接件齐全并压紧；部件被遮挡或距离过远导致无法检查时，
      应判 undecidable 而不是判无缺陷。
    observation: 一张图可能存在多处缺陷，只需回答「是否存在任一缺陷」。
