  ocr_tokens: {prompt: 366, completion: 45}

# 探针暴露的坑（已在代码/提示词中修正，后续务必保持）
known_issues:
  - id: KI-01
    title: 提示词中的字面示例值会被模型照抄
    detail: 首版示例写 "confidence":0.0，模型对全部检测项都返回 0.0，等于没有置信度。
    fix: 示例改用 0.82 并显式声明「示例仅为格式示范，禁止照抄」；提示词评审时禁止出现 0/1 这类极端示例值。
  - id: KI-02
    title: bbox 是 0~1000 相对坐标，不是像素
    detail: 实测 y2=915，而图像高度只有 720，按像素裁剪必然错位。
    fix: Detection.bbox_space="norm1000"，入库前调用 Detection.to_pixel_bbox(w, h) 换算并裁剪。
  - id: KI-03
    title: 置信度普遍过高（正值报 1.0，负值报 0.0）
    detail: 合成图上模型对"有人无安全帽/出口堵塞"直接给 1.0，不能作为唯一阈值依据。
    fix: 阈值三分支仍需保留，但所有事件默认 need_manual_review=true；后续用真实数据做分桶校准。

