# 约定：model id 只允许在此文件与 .env 中出现，业务代码禁止硬编码。
version: 0.1.0

provider:
  name: 千炼 MaaS 网关
  protocol: openai-compatible
  base_url: https://ws-8cl1ej8elduuovea.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  dashscope_native: https://ws-8cl1ej8elduuovea.cn-beijing.maas.aliyuncs.com/api/v1
  workspace_id: ws-8cl1ej8elduuovea
  workspace_name: 化工巡检
  auth: "Authorization: Bearer <MAAS_API_KEY>"

roles:
  # 主力：单图多类别隐患判定
  vision_judge:
    model: qwen3-vl-plus
    verified: true           # 2026-11-06 探针：base64 + json_object 均可用
    notes: 同族备选 qwen3.5-omni-plus / qwen3.8-omni-flash
  # 附加：表计读数抽取（只读数字，不做超限判定）
  meter_ocr:
    model: qwen-vl-ocr
    verified: true           # 探针：0.85 MPa 读取正确
    notes: 备选 qwen3.5-ocr / vanchin/deepseek-ocr
  # 可选：判级说明润色、隐患标准问答（MVP 默认不用）
